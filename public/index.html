<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расчет доставки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Рассчитать время доставки</h1>
    <form id="deliveryForm">
        <label>Расстояние (км):</label>
        <input type="number" id="distance" placeholder="Например, 100">

        <label>Скорость (км/ч):</label>
        <input type="number" id="speed" value="60">

        <label>Тип местности:</label>
        <select id="terrainType">
            <option value="трасса">Трасса</option>
            <option value="город">Город</option>
        </select>

        <label>Коэффициент пробок (Город):</label>
        <select id="trafficScore">
            <option value="0">Нет пробок (0)</option>
            <option value="3">Берлин (3)</option>
            <option value="5">Минск/Париж (5)</option>
            <option value="7">Москва (7)</option>
        </select>

        <button type="button" id="calculateBtn">Рассчитать время</button>
    </form>

    <div id="resultArea" class="hidden">
        <h3>Результат:</h3>
        <p id="resultText"></p>
    </div>
    <div id="errorArea" class="hidden">
        <p id="errorText" style="color: red;"></p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
