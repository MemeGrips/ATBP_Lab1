name: Python CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Матрица версий
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright allure-pytest

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps

      - name: Start Flask Server
        run: |
          python app.py &
          sleep 5

      - name: Run Tests
        run: python -m pytest --alluredir=allure-results
        continue-on-error: true

      # СОХРАНЯЕМ РЕЗУЛЬТАТЫ В ОБЛАКО
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.python-version }}
          path: allure-results
          retention-days: 1

  report:
    needs: test # Ждем, пока закончатся все тесты
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # СКАЧИВАЕМ ВСЕ РЕЗУЛЬТАТЫ (и от 3.10, и от 3.11)
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: allure-results-all

      # Собираем результаты в одну кучу для Allure
      - name: Prepare allure results
        run: |
          mkdir -p allure-results
          cp -r allure-results-all/**/* allure-results/ || true

      - name: Load Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 CI Pipeline Finished!
            Status: ${{ job.status }}
            Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}